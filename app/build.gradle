plugins {
    id 'com.android.application'
}

android {
    namespace 'de.wasteland.launcher'
    compileSdk 34

    defaultConfig {
        applicationId "de.wasteland.launcher"
        minSdk 22
        targetSdk 28
        versionCode 5
        versionName "5.0-wasteland-crt"
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
}
